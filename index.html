<!DOCTYPE html>

<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>big shelf</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="page-dashboard">
        <aside class="sidebar">
            <nav class="sidemenu">
                <a class="dashboard" href="index.html">DASHBOARD<br>(HOME PAGE)</a>
                <a class="inven" href="inventory.html">INVENTORY</a>
                <a class="sales" href="pointofsales.html">POINT OF SALES</a>
                <a class="trans" href="riwayattransaksi.html">RIWAYAT TRANSAKSI</a>
            </nav>
        </aside>
        <main>
            <section class="pendapatan">
                <h3>total pendapatan<br>hari ini</h3>
                <h2 id="totalPendapatan">Rp.0</h2>
                <span>+12% dari kemarin</span>
                <select id="filterPendapatan">
                    <option value="hari">Hari ini</option>
                    <option value="minggu">Minggu ini</option>
                    <option value="bulan">Bulan ini</option>
                </select>
            </section>
            <section class="transaksi">
                <h3>jumlah transaksi<br>sukses</h3>
                <h2 id="jumlahTransaksi">10.000</h2>
                <select id="filterTransaksi">
                    <option value="hari">Hari ini</option>
                    <option value="minggu">Minggu ini</option>
                    <option value="bulan">Bulan ini</option>
                </select>
            </section>
            <section class="produk">
                <h3>jumlah produk<br>unik</h3>
                <h2 id="jumlahProduk">10</h2>
                <span id="infoStok">stok kemeja di bawah 5</span>
            </section>
            <section class="chartpendapatan">
                <h3>Pendapatan</h3>
                <canvas id="chartPendapatan"></canvas>
                <select id="filterChartPendapatan">
                    <option>per Hari</option>
                    <option>Per minggu</option>
                    <option>Per bulan</option>
                </select>
            </section>
            <section class="produkterjual">
                <h3>Produk Terjual</h3>
                <canvas id="chartProdukTerjual"></canvas>
            </section>
            <section class="">
                <table id="tabelTransaksi" border="1">
                    <tr>
                        <th>barang yang di beli</th>
                        <th>jumlah barang</th>
                        <th>harga</th>
                        <th>waktu</th>
                    </tr>
                </table>
            </section>
        </main>
        <script src="script.js"></script>
    </body>
</html>
