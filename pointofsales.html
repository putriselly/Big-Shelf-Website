<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>point of sales</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="page-sales">
        <aside class="sidebar">
            <nav class="sidemenu">
                <a class="dashboard" href="index.html">DASHBOARD<br>(HOME PAGE)</a>
                <a class="inven" href="inventory.html">INVENTORY</a>
                <a class="sales" href="pointofsales.html">POINT OF SALES</a>
                <a class="trans" href="riwayattransaksi.html">RIWAYAT TRANSAKSI</a>
            </nav>
        </aside>
        <h1>POINT OF SALES</h1>
        <main>
            <section class="produk-section">
                    <div class="searcproduk">
                        <img src="glass.png"/>
                        <input id="search" placeholder="cari nama produk">
                    </div>
                    <div class="filterkategori">
                        <img src="filter.png"/>
                        <select id="filter">
                            <option value="semua">semua</option>
                            <option value="baju">baju</option>
                            <option value="celana">celana</option>
                            <option value="sepatu">sepatu</option>
                        </select>
                    </div>
                    <table border="1" id="tabel">
                        <tr>
                            <th>nama barang</th>
                            <th>kategori</th>
                            <th>jumlah stok</th>
                            <th>harga barang</th>
                            <th>tambahkan</th>
                        </tr>
                    </table>
            </section>
            <section class="keranjang">
                <div class="header-keranjang">
                    <div class="icon-keranjang">
                        🛒
                    </div>
                    <div class="jumlah-barang" id="jumlahBarang">
                        0 barang
                    </div>
                </div>
                <div class="daftar-keranjang" id="daftarKeranjang">

                </div>
                <div class="pembayaran">
                    <div class="subtotal">
                        <span>
                            Sub Total :
                        </span>
                        <span id="subtotal">
                            Rp0
                        </span>
                    </div>
                    <div class="uang-pembeli">
                        <label for="uangPembeli">
                            Uang Tunai Pembeli :
                        </label>
                        <input
                            type="number"
                            id="uangPembeli"
                            placeholder="Masukkan uang"
                        >
                    </div>
                    <div class="kembalian">
                        <span>
                            Uang Kembalian :
                        </span>
                        <span id="uangKembalian">
                            Rp0
                        </span>

                    </div>
                    <button id="prosesPembayaran">
                        PROSES PEMBAYARAN
                    </button>
                </div>
            </section>
        </main>
        <script src="pointofsales.js"></script>
    </body>
</html>
